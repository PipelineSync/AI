# Netlify configuration for the PipelineSync AI prototype.
# Static app in /public, stateless API in /netlify/functions.
# No build step needed: the app is plain HTML/CSS/JS.

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Security headers for all responses (static + functions)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    # media-src is required by the voice layer: the AI speech is played from blob:/data: URLs.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# API routes -> Netlify functions (same paths the frontend already calls)
# The entry gate is name + email (no password): /api/auth/start.
# /api/auth/login is kept as an alias of the same function for cached clients.
[[redirects]]
  from = "/api/auth/start"
  to = "/.netlify/functions/start"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/start"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/extract"
  to = "/.netlify/functions/extract"
  status = 200

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/deliver"
  to = "/.netlify/functions/deliver"
  status = 200

# Voice layer: one function serves /api/voice/session, /turn, /transcribe and /speak.
# OPENAI_API_KEY is read inside the function and never sent to the browser.
[[redirects]]
  from = "/api/voice/*"
  to = "/.netlify/functions/voice"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Dev view: where leads land (Netlify variant explains the logs)
[[redirects]]
  from = "/dev/outbox"
  to = "/.netlify/functions/outbox"
  status = 200
